<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1e38"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Decorative Glow Spheres -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="300" r="160" fill="#c084fc" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="210" r="180" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Inner Glass Card -->
  <rect x="60" y="40" width="1080" height="340" rx="24" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Badges Row Top -->
  <g transform="translate(100, 75)">
    <!-- Badge 1: Python 3.12+ -->
    <rect x="0" y="0" width="135" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#38bdf8"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Python 3.12+</text>

    <!-- Badge 2: Bilingual Edition -->
    <rect x="150" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <circle cx="166" cy="16" r="6" fill="#818cf8"/>
    <text x="182" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">العربية | English 1:1</text>

    <!-- Badge 3: Open Source Classic -->
    <rect x="330" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <circle cx="346" cy="16" r="6" fill="#10b981"/>
    <text x="362" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Open Source (MIT)</text>

    <!-- Badge 4: Interactive Video Scripts -->
    <rect x="495" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="511" cy="16" r="6" fill="#fbbf24"/>
    <text x="527" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">26 Video Scripts</text>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(100, 175)">
    <!-- Book Icon Graphic -->
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48">📚</text>
    
    <!-- English & Arabic Main Title -->
    <text x="70" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#primaryGrad)">The Craft of Self-Teaching</text>
    <text x="640" y="-8" font-family="Tahoma, Arial, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#ffffff" direction="rtl">فن التعلّم الذاتي</text>

    <!-- Subtitle English -->
    <text x="70" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      A Modernized, Bilingual Curriculum on Independent Learning &amp; Modern Python
    </text>

    <!-- Subtitle Arabic -->
    <text x="70" y="62" font-family="Tahoma, Arial, 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" direction="rtl">
      دليل عملي وتفاعلي لاكتساب أعظم مهارات العصر: كيف تتعلّم أي شيء ذاتياً بالبرمجة
    </text>
  </g>

  <!-- Feature Pills Bottom -->
  <g transform="translate(100, 310)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">📓 26 Jupyter Notebooks</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="220" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="253" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">⚡ 1-Click Google Colab</text>

    <!-- Pill 3 -->
    <rect x="470" y="0" width="235" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="488" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">💡 Graded Coding Challenges</text>

    <!-- Pill 4 -->
    <rect x="720" y="0" width="260" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="738" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">🎬 Edge-TTS &amp; CapCut Scripts</text>
  </g>
</svg>
