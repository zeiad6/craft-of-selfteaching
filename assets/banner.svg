<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Vibrant Animated Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#818cf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#c084fc" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-arabic { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    .badge-text { font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .pill-text { font-size: 13.5px; font-weight: 500; fill: #e2e8f0; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.12; transform: scale(1); }
      50% { opacity: 0.24; transform: scale(1.08); }
    }
    
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .pulse-ambient-1 {
      animation: pulseGlow 5s ease-in-out infinite;
      transform-origin: 220px 120px;
    }
    .pulse-ambient-2 {
      animation: pulseGlow 6s ease-in-out infinite reverse;
      transform-origin: 980px 300px;
    }
    .blink-bar {
      animation: blinkCursor 1s step-start infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="440" fill="url(#bgGrad)"/>

  <!-- Animated Ambient Glow Spheres -->
  <circle cx="220" cy="120" r="160" fill="#38bdf8" class="pulse-ambient-1" opacity="0.16" filter="url(#glow)">
    <animate attributeName="opacity" values="0.10;0.22;0.10" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="300" r="170" fill="#c084fc" class="pulse-ambient-2" opacity="0.16" filter="url(#glow)">
    <animate attributeName="opacity" values="0.12;0.26;0.12" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="220" r="200" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Subtle Tech Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="88" x2="1200" y2="88"/>
    <line x1="0" y1="176" x2="1200" y2="176"/>
    <line x1="0" y1="264" x2="1200" y2="264"/>
    <line x1="0" y1="352" x2="1200" y2="352"/>
    <line x1="200" y1="0" x2="200" y2="440"/>
    <line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="600" y1="0" x2="600" y2="440"/>
    <line x1="800" y1="0" x2="800" y2="440"/>
    <line x1="1000" y1="0" x2="1000" y2="440"/>
  </g>

  <!-- Centered Glass Card with Neon Border Accent -->
  <rect x="50" y="30" width="1100" height="380" rx="24" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5"/>

  <!-- 1. Top Badges Row (Centered at X=600) -->
  <g transform="translate(600, 72)" text-anchor="middle">
    <!-- Badge 1: Python 3.12+ -->
    <g transform="translate(-320, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="-50" cy="0" r="5" fill="#38bdf8">
        <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="8" y="5" class="font-sans badge-text">Python 3.12+</text>
    </g>

    <!-- Badge 2: Bilingual 1:1 -->
    <g transform="translate(-105, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <circle cx="-65" cy="0" r="5" fill="#818cf8"/>
      <text x="10" y="5" class="font-sans badge-text">العربية | English 1:1</text>
    </g>

    <!-- Badge 3: Open Source -->
    <g transform="translate(100, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <circle cx="-55" cy="0" r="5" fill="#10b981"/>
      <text x="10" y="5" class="font-sans badge-text">MIT Open Source</text>
    </g>

    <!-- Badge 4: Video Scripts -->
    <g transform="translate(305, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <circle cx="-60" cy="0" r="5" fill="#fbbf24"/>
      <text x="10" y="5" class="font-sans badge-text">26 Video Masteries</text>
    </g>
  </g>

  <!-- 2. Main Title Line: Arabic (Centered) -->
  <text x="600" y="165" text-anchor="middle" class="font-arabic" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    📚 فن التعلّم الذاتي
  </text>

  <!-- 3. Sub-Title Line: English with Gradient & Typing Cursor (Centered) -->
  <g transform="translate(600, 218)">
    <text x="-10" y="0" text-anchor="middle" class="font-sans" font-size="28" font-weight="800" fill="url(#primaryGrad)" letter-spacing="3">
      THE CRAFT OF SELF-TEACHING
    </text>
    <!-- Blinking Terminal Prompt -->
    <rect x="250" y="-22" width="4" height="26" fill="#38bdf8" class="blink-bar">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 4. Tagline: Clean Bilingual (Centered) -->
  <text x="600" y="262" text-anchor="middle" class="font-arabic" font-size="16" font-weight="500" fill="#94a3b8">
    دليل عملي لاكتساب مهارة التعلّم الذاتي عبر بايثون الحديثة  •  Modernized Interactive Guide
  </text>

  <!-- 5. Bottom Feature Pills (Centered at X=600) -->
  <g transform="translate(600, 342)" text-anchor="middle">
    <!-- Pill 1: Notebooks -->
    <g transform="translate(-390, 0)">
      <rect x="-115" y="-20" width="230" height="40" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="0" y="5" class="font-sans pill-text">📓 26 Jupyter Notebooks</text>
    </g>

    <!-- Pill 2: Colab -->
    <g transform="translate(-130, 0)">
      <rect x="-115" y="-20" width="230" height="40" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="0" y="5" class="font-sans pill-text">⚡ 1-Click Google Colab</text>
    </g>

    <!-- Pill 3: Challenges -->
    <g transform="translate(130, 0)">
      <rect x="-115" y="-20" width="230" height="40" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="0" y="5" class="font-sans pill-text">💡 Coding Challenges</text>
    </g>

    <!-- Pill 4: CapCut Scripts -->
    <g transform="translate(390, 0)">
      <rect x="-115" y="-20" width="230" height="40" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="0" y="5" class="font-sans pill-text">🎬 26 Rendered 1080p MP4s</text>
    </g>
  </g>
</svg>
