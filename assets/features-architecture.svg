<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250">
  <defs>
    <linearGradient id="featBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="glowBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="glowBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="glowBorder3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="glowBorder4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <style>
    .feat-title { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .feat-sub { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; font-weight: 600; }
    .feat-desc { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 12px; fill: #94a3b8; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    
    .pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="250" rx="18" fill="url(#featBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Card 1: Modern Python 3.12+ -->
  <g transform="translate(35, 25)">
    <rect width="265" height="200" rx="14" fill="#1e293b" fill-opacity="0.45" stroke="url(#glowBorder1)" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="18" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="41" text-anchor="middle" font-size="18">🐍</text>
    <text x="64" y="33" class="feat-title">بايثون الحديثة 3.12+</text>
    <text x="64" y="49" class="feat-sub" fill="#38bdf8">Modern Python Core</text>
    <line x1="20" y1="70" x2="245" y2="70" stroke="#334155" stroke-width="1"/>
    <text x="20" y="98" class="feat-desc">• تلميحات الأنواع الحديثة (Type Hints)</text>
    <text x="20" y="123" class="feat-desc">• مطابقة الأنماط المتقدمة (match/case)</text>
    <text x="20" y="148" class="feat-desc">• نصوص f-strings الذكية و pathlib</text>
    <text x="20" y="173" class="feat-desc">• فئات البيانات المنظمة (@dataclass)</text>
  </g>

  <!-- Card 2: Interactive Notebooks & Colab -->
  <g transform="translate(325, 25)">
    <rect width="265" height="200" rx="14" fill="#1e293b" fill-opacity="0.45" stroke="url(#glowBorder2)" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="18" fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="34" y="41" text-anchor="middle" font-size="18">📓</text>
    <text x="64" y="33" class="feat-title">26 دفتراً تفاعلياً</text>
    <text x="64" y="49" class="feat-sub" fill="#fbbf24">JupyterLab &amp; Colab</text>
    <line x1="20" y1="70" x2="245" y2="70" stroke="#334155" stroke-width="1"/>
    <text x="20" y="98" class="feat-desc">• تشغيل فوري سحابياً بزر واحد</text>
    <text x="20" y="123" class="feat-desc">• توافق تام مع VS Code محلياً</text>
    <text x="20" y="148" class="feat-desc">• بيئة جاهزة بدون إعدادات معقدة</text>
    <text x="20" y="173" class="feat-desc">• تغطية شاملة لكامل فصول الكتاب</text>
  </g>

  <!-- Card 3: Active Learning Framework -->
  <g transform="translate(615, 25)">
    <rect width="265" height="200" rx="14" fill="#1e293b" fill-opacity="0.45" stroke="url(#glowBorder3)" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="18" fill="#7c3aed" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="41" text-anchor="middle" font-size="18">🧠</text>
    <text x="64" y="33" class="feat-title">تعليم بيداغوجي نشط</text>
    <text x="64" y="49" class="feat-sub" fill="#c084fc">Active Pedagogy</text>
    <line x1="20" y1="70" x2="245" y2="70" stroke="#334155" stroke-width="1"/>
    <text x="20" y="98" class="feat-desc">• أخطاء برمجية شائعة وكيفية حلها</text>
    <text x="20" y="123" class="feat-desc">• نصائح استراتيجية للتعلّم الذاتي</text>
    <text x="20" y="148" class="feat-desc">• تحديات مفصولة لحماية التفكير</text>
    <text x="20" y="173" class="feat-desc">• مسرد مصطلحات معتمد ومحدث</text>
  </g>

  <!-- Card 4: Video Masteries -->
  <g transform="translate(905, 25)">
    <rect width="260" height="200" rx="14" fill="#1e293b" fill-opacity="0.45" stroke="url(#glowBorder4)" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="18" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
    <text x="34" y="41" text-anchor="middle" font-size="18">🎬</text>
    <text x="64" y="33" class="feat-title">30 فيديو شارح (1080p)</text>
    <text x="64" y="49" class="feat-sub" fill="#34d399">Automated Studio Engine</text>
    <line x1="20" y1="70" x2="240" y2="70" stroke="#334155" stroke-width="1"/>
    <text x="20" y="98" class="feat-desc">• تعليق استوديو بـ Edge-TTS</text>
    <text x="20" y="123" class="feat-desc">• واجهة محرر كود حقيقي أنيق</text>
    <text x="20" y="148" class="feat-desc">• إنتاج مؤتمت بـ FFmpeg</text>
    <text x="20" y="173" class="feat-desc">• سكريبتات مفتوحة وقابلة للتعديل</text>
  </g>
</svg>