<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: 'Segoe UI', Tahoma, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #94a3b8; }
    .font-desc { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 12.5px; fill: #cbd5e1; }
    .node-num { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 800; }
    
    @keyframes flowLine {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulseRing {
      0%, 100% { r: 14; opacity: 0.8; }
      50% { r: 18; opacity: 0.25; }
    }

    .animated-wire {
      stroke-dasharray: 8 5;
      animation: flowLine 1.2s linear infinite;
    }
    
    .ring-pulse {
      animation: pulseRing 2.2s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="18" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(600, 32)" text-anchor="middle">
    <text font-family="'Segoe UI', Tahoma, sans-serif" font-size="16.5" font-weight="800" fill="#f8fafc">
      🔄 حلقة التعلّم الذاتي المستمر • The Continuous Self-Teaching Loop
    </text>
  </g>

  <!-- Connecting Animated Loop Track (Upper Path) -->
  <path d="M 285 135 L 340 135" fill="none" stroke="#38bdf8" stroke-width="2.5" class="animated-wire" opacity="0.9"/>
  <polygon points="345,135 337,131 337,139" fill="#38bdf8"/>

  <path d="M 575 135 L 630 135" fill="none" stroke="#818cf8" stroke-width="2.5" class="animated-wire" opacity="0.9"/>
  <polygon points="635,135 627,131 627,139" fill="#818cf8"/>

  <path d="M 865 135 L 920 135" fill="none" stroke="#c084fc" stroke-width="2.5" class="animated-wire" opacity="0.9"/>
  <polygon points="925,135 917,131 917,139" fill="#c084fc"/>

  <!-- Return Flowing Arc (Lower Path - Closing the Loop from 4 back to 1) -->
  <path d="M 1045 210 C 1045 285, 160 285, 160 215" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" class="animated-wire" opacity="0.8"/>
  <polygon points="160,210 156,218 164,218" fill="#fbbf24"/>

  <!-- Arc Description Badge -->
  <g transform="translate(600, 282)" text-anchor="middle">
    <rect x="-210" y="-14" width="420" height="28" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text y="5" font-family="'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">
      ⚡ كل مشروع واقعي تبنيه يكشف لك أسئلة جديدة ويغذي قراءتك المتأنية التالية
    </text>
  </g>

  <!-- CARD 1: Careful Reading -->
  <g transform="translate(50, 65)">
    <rect x="0" y="0" width="235" height="140" rx="14" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="18" fill="none" stroke="#38bdf8" stroke-width="1" class="ring-pulse"/>
    <text x="28" y="33" text-anchor="middle" class="node-num" fill="#38bdf8">01</text>
    <text x="54" y="33" class="font-title">📖 القراءة الدقيقة</text>
    <text x="20" y="58" class="font-sub">Careful Reading</text>
    <text x="20" y="86" class="font-desc">قراءة كل رمز بروتوكولي بهدوء</text>
    <text x="20" y="108" class="font-desc">وفهم منطق الحاسوب بعمق وتأنٍّ</text>
  </g>

  <!-- CARD 2: Active Tinkering -->
  <g transform="translate(340, 65)">
    <rect x="0" y="0" width="235" height="140" rx="14" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="18" fill="none" stroke="#818cf8" stroke-width="1" class="ring-pulse"/>
    <text x="28" y="33" text-anchor="middle" class="node-num" fill="#818cf8">02</text>
    <text x="54" y="33" class="font-title">🛠️ الممارسة والتجربة</text>
    <text x="20" y="58" class="font-sub">Deliberate Practice</text>
    <text x="20" y="86" class="font-desc">تشغيل الكود وتفكيك أجزائه</text>
    <text x="20" y="108" class="font-desc">واختبار كل الفرضيات البرمجية يدوياً</text>
  </g>

  <!-- CARD 3: Traceback & Documentation -->
  <g transform="translate(630, 65)">
    <rect x="0" y="0" width="235" height="140" rx="14" fill="url(#cardBg)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="18" fill="none" stroke="#c084fc" stroke-width="1" class="ring-pulse"/>
    <text x="28" y="33" text-anchor="middle" class="node-num" fill="#c084fc">03</text>
    <text x="54" y="33" class="font-title">🧭 فك الأخطاء والتوثيق</text>
    <text x="20" y="58" class="font-sub">Traceback &amp; Docs</text>
    <text x="20" y="86" class="font-desc">الخطأ خريطة ترشدك لمكان العطل</text>
    <text x="20" y="108" class="font-desc">والتوثيق الرسمي هو بوصلتك الدائمة</text>
  </g>

  <!-- CARD 4: Independent Creation -->
  <g transform="translate(920, 65)">
    <rect x="0" y="0" width="235" height="140" rx="14" fill="url(#cardBg)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="18" fill="none" stroke="#34d399" stroke-width="1" class="ring-pulse"/>
    <text x="28" y="33" text-anchor="middle" class="node-num" fill="#34d399">04</text>
    <text x="54" y="33" class="font-title">🚀 بناء المشاريع</text>
    <text x="20" y="58" class="font-sub">Independent Creation</text>
    <text x="20" y="86" class="font-desc">صناعة أدوات برمجية نافعة للواقع</text>
    <text x="20" y="108" class="font-desc">ونشرها للعلن والمجتمع كأثر باقٍ</text>
  </g>
</svg>