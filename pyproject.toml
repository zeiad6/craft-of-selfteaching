[project]
name = "craft-of-selfteaching"
version = "2.0.0"
description = "Bilingual (Arabic & English) modernized edition of 'The Craft of Self-Teaching' for Python 3.12+"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.2.0",
    "notebook>=7.2.0",
    "ipykernel>=6.29.0",
    "requests>=2.32.0",
    "rich>=13.8.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "nbmake>=1.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
